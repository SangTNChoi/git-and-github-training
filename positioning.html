<!DOCTYPE html>
<html>
    <head>
        <title>something</title>

    </head>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing: border-box;
}
.container{
    border:4px solid red;
    width:50%;
    height:600px;
    margin:0 auto;
    display: flex;
    flex-direction: column; 
}
.header{
    height:80px;
    background-color:rgb(255, 206, 133);
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}
.sub-container{
    background-color: rgb(139, 255, 139);
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    gap:9px;
}
.sub-container div{
    border:2px solid blue;
    height:40px;
}
.sub1{
    display:flex;
    align-items:flex-end;
}
.sub1 h3{
    border:2px solid black;
    border-radius: 15px;
    width:40%;
    
}
    </style>
    <body>
        <div class="container">
            <div class="header">
                <h1>Form đăng kí</h1>
            </div>
            <div class="sub-container">
                <div class="sub1">
                    <h3>Tên Đăng Nhập:</h3>
                </div>
                <div class="sub2"></div>
                <div class="sub3"></div>
                <div class="sub4"></div>
                <div class="sub5"></div>
                <div class="sub6"></div>
                <div class="sub7"></div>
                <div class="sub8"></div>
                <div class="sub9"></div>
                <div class="sub10"></div>

            </div>
        </div>
    </body>
</html>
